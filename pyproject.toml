[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hsr-mapping"
version = "0.1.0"
description = "HSR Environment Mapping Bot — autonomous exploration using screenshots + ADB"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "opencv-python",
    "httpx",
    "pydantic",
    "scipy",
    "networkx",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov"]

[project.scripts]
hsr-map = "mapping.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
